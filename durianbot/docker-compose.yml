version: '3.8'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: durianbot-app
    restart: unless-stopped
    ports:
      - "8000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://durianbot:${DB_PASSWORD:-password}@db:5432/durianbot
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./temp:/app/temp
    networks:
      - durianbot-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database
  db:
    image: postgres:16-alpine
    container_name: durianbot-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=durianbot
      - POSTGRES_USER=durianbot
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - durianbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durianbot -d durianbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: durianbot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - durianbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: durianbot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/ssl/certs:ro
    depends_on:
      - app
    networks:
      - durianbot-network
    profiles:
      - nginx

  # Redis Commander (development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: durianbot-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - durianbot-network
    profiles:
      - dev

  # Database admin (development)
  adminer:
    image: adminer:latest
    container_name: durianbot-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - durianbot-network
    profiles:
      - dev

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  durianbot-network:
    driver: bridge

